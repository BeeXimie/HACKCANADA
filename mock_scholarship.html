<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaders Scholarship Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-12 px-4">
    <div class="max-auto max-w-2xl bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
        <div class="bg-indigo-600 p-6">
            <h1 class="text-2xl font-bold text-white">Global Leaders Scholarship 2026</h1>
            <p class="text-indigo-100 text-sm italic">Deadline: June 30th, 2026</p>
        </div>
        
        <form id="scholarship-form" class="p-8 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Given Name</label>
                    <input type="text" name="first_name" id="user-fn" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="e.g. Jane">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Surname</label>
                    <input type="text" name="last_name" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="e.g. Doe">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Academic Standing (GPA)</label>
                <input type="text" aria-label="grade point average" name="gpa_score" class="mt-1 block w-32 rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Current Field of Study</label>
                <input type="text" name="major_field" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
            </div>

            <div class="border-t pt-6">
                <label class="block text-sm font-bold text-slate-800 mb-2">Essay Prompt:</label>
                <p class="text-sm text-slate-600 mb-4 italic">"Please describe a time you demonstrated leadership in a technical environment and how it impacted your community."</p>
                <textarea rows="6" name="personal_essay" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border" placeholder="Begin typing your response..."></textarea>
            </div>

            <div class="flex justify-end">
                <button type="button" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold shadow-md hover:bg-indigo-700 transition" onclick="alert('Form submitted!')">Submit Application</button>
            </div>
        </form>
    </div>
</body>
</html>
