<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to ScholarSync - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }
      .autocomplete-items {
        position: absolute;
        border: 1px solid #e2e8f0;
        border-bottom: none;
        border-top: none;
        z-index: 99;
        top: 100%;
        left: 0;
        right: 0;
        border-radius: 0 0 0.75rem 0.75rem;
        max-height: 200px;
        overflow-y: auto;
      }
      .autocomplete-items div {
        padding: 0.75rem 1rem;
        cursor: pointer;
        background-color: #fff;
        border-bottom: 1px solid #f1f5f9;
      }
      .autocomplete-items div:hover {
        background-color: #f8fafc;
      }
      .autocomplete-active {
        background-color: #e2e8f0 !important;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex flex-col items-center justify-center p-4"
  >
    <!-- Logo -->
    <div class="mb-4 flex items-center justify-center gap-2 text-indigo-600">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-8 w-8"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
        <path d="M6 12v5c3 3 9 3 12 0v-5" />
      </svg>
      <span class="text-2xl font-bold tracking-tight text-slate-900"
        >Scholar<span class="text-indigo-600">Sync</span></span
      >
    </div>

    <!-- Onboarding Form Container -->
    <div
      class="w-full max-w-2xl glass-panel border border-white rounded-3xl shadow-xl overflow-hidden"
    >
      <div
        class="h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"
      ></div>

      <div class="p-8 sm:p-10">
        <div id="onboarding-header" class="mb-8">
          <div class="flex items-center gap-2 mb-2">
            <span id="step-badge" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider">Step 1 of 2</span>
            <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
              <div id="step-progress" class="w-1/2 h-full bg-indigo-500 transition-all duration-500"></div>
            </div>
          </div>
          <h1 id="step-title" class="text-2xl font-bold text-slate-900 mb-1">Tell us about yourself</h1>
          <p id="step-subtitle" class="text-sm text-slate-500">We'll use this to find the best scholarships and autofill your profile.</p>
        </div>

        <form id="onboarding-form" action="/onboarding" method="POST" enctype="multipart/form-data" class="space-y-6">
          <!-- Step 1: Basic Info & Resume -->
          <div id="step-1-content" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Location -->
            <div class="relative">
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="location"
                >Location</label
              >
              <div class="relative autocomplete">
                <input
                  type="text"
                  id="location"
                  name="location" placeholder="Search Canadian cities..."
                  class="w-full pl-4 pr-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm"
                />
                <div
                  id="autocomplete-list"
                  class="autocomplete-items shadow-lg"
                ></div>
              </div>
              <p id="location-error" class="hidden text-xs text-red-500 mt-1 font-medium">Please select a valid city from the list.</p>
              <div class="flex items-center mt-2 gap-2">
                <input
                  type="checkbox"
                  id="not_in_canada"
                  name="not_in_canada"
                  class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4"
                  onchange="toggleLocation(this)"
                />
                <label
                  for="not_in_canada"
                  class="text-xs text-slate-500 cursor-pointer"
                  >I am currently outside of Canada</label
                >
              </div>
            </div>
            <!-- Removed duplicate GPA dropdown -->
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Gender -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="gender"
                >Gender</label
              >
              <select
                id="gender"
                name="gender" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>

            <!-- Ethnicity -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="ethnicity"
                >Ethnicity</label
              >
              <select
                id="ethnicity"
                name="ethnicity" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select</option>
                <option value="Indigenous">Indigenous</option>
                <option value="Black">Black</option>
                <option value="Asian">Asian</option>
                <option value="White">White</option>
                <option value="Hispanic">Hispanic</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Year of Study -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="year_of_study"
                >Year of Study</label
              >
              <select
                id="year_of_study"
                name="year_of_study" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select year</option>
                <option value="Incoming First Year">Incoming First Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
                <option value="Graduate">Graduate</option>
              </select>
            </div>
            <!-- Citizenship -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="citizenship"
                >Citizenship</label
              >
              <select
                id="citizenship"
                name="citizenship" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select</option>
                <option value="Domestic">Domestic (Citizen/PR)</option>
                <option value="International">International (Visa)</option>
              </select>
            </div>
          </div>

          <!-- Eligibility Fields (New) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="income_bracket">Household Income</label>
              <select id="income_bracket" name="income_bracket" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select income range</option>
                <option value="Under $30,000">Under $30,000</option>
                <option value="$30,000 – $60,000">$30,000 – $60,000</option>
                <option value="$60,000 – $100,000">$60,000 – $100,000</option>
                <option value="$100,000 – $150,000">$100,000 – $150,000</option>
                <option value="Over $150,000">Over $150,000</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="first_gen">First-Gen Student?</label>
              <select id="first_gen" name="first_gen" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="enrollment">Enrollment Status</label>
              <select id="enrollment" name="enrollment" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select status</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="fafsa">Filed for Financial Aid?</label>
              <select id="fafsa" name="fafsa" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="disability">Disability/Access Needs?</label>
              <select id="disability" name="disability" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="veteran">Veteran/Military Status</label>
              <select id="veteran" name="veteran" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select</option>
                <option value="Veteran">Veteran</option>
                <option value="Active Duty">Active Duty</option>
                <option value="Military Dependent">Military Dependent</option>
                <option value="None">None</option>
              </select>
            </div>
          </div>

          <!-- Document Uploads -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
            <!-- Resume Upload -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-3"
                >Upload Resume (PDF only)</label
              >
              <div id="resume-drop-zone" class="relative group">
                <label
                  for="resume"
                  class="cursor-pointer flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-indigo-200 rounded-2xl bg-indigo-50/30 group-hover:bg-indigo-50 group-hover:border-indigo-300 transition-all"
                >
                  <div class="p-3 bg-white rounded-full shadow-sm mb-3">
                    <svg
                      class="h-6 w-6 text-indigo-500"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                      />
                      <polyline points="14 2 14 8 20 8" />
                      <line x1="12" y1="18" x2="12" y2="12" />
                      <line x1="9" y1="15" x2="15" y2="15" />
                    </svg>
                  </div>
                  <span
                    id="resume-name"
                    class="text-sm font-semibold text-slate-600"
                    >Click to upload or drag resume</span
                  >
                  <span class="text-xs text-slate-400 mt-1"
                    >PDF format </span
                  >
                </label>
                <input
                  type="file"
                  id="resume"
                  name="resume"
                  accept=".pdf" class="hidden"
                  onchange="updateFileName('resume', 'resume-name')"
                />
              </div>
            </div>

            <!-- Transcript Upload -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-3"
                >Upload Transcript (PDF only)</label
              >
              <div id="transcript-drop-zone" class="relative group">
                <label
                  for="transcript"
                  class="cursor-pointer flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-emerald-200 rounded-2xl bg-emerald-50/30 group-hover:bg-emerald-50 group-hover:border-emerald-300 transition-all"
                >
                  <div class="p-3 bg-white rounded-full shadow-sm mb-3">
                    <svg
                      class="h-6 w-6 text-emerald-500"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                      />
                      <polyline points="14 2 14 8 20 8" />
                      <path d="M12 18V12" />
                      <path d="M9 15l3-3 3 3" />
                    </svg>
                  </div>
                  <span
                    id="transcript-name"
                    class="text-sm font-semibold text-slate-600"
                    >Click to upload transcript</span
                  >
                  <span class="text-xs text-slate-400 mt-1"
                    >Provide for academic validation</span
                  >
                </label>
                <input
                  type="file"
                  id="transcript"
                  name="transcript"
                  accept=".pdf"
                  class="hidden"
                  onchange="updateFileName('transcript', 'transcript-name')"
                />
              </div>
            </div>
          </div>

          <script>
            function updateFileName(inputId, nameId) {
              const file = document.getElementById(inputId).files[0];
              const nameSpan = document.getElementById(nameId);
              if (file) {
                nameSpan.innerHTML = `<span class="text-indigo-600 font-bold">Selected: ${file.name}</span>`;
                console.log(`File selected for ${inputId}:`, file.name);
              }
            }
          </script>

            <button
              type="button"
              onclick="autofillAndContinue()"
              id="continue-btn"
              class="w-full flex items-center justify-center gap-2 py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-100 transition-all active:scale-[0.98]"
            >
              <span id="btn-text">Autofill from Resume & Continue</span>
              <svg id="btn-icon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              <svg id="loading-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>

          <!-- Step 2: Confirmation & Experience (Initially Hidden) -->
          <div id="step-2-content" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" for="institution">University / Institution</label>
                <input type="text" id="institution" name="institution" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm">
              </div>
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" for="major">Field of Study / Major</label>
                <input type="text" id="major" name="major" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
               <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2" for="degree">Degree Level</label>
                  <select id="degree" name="degree" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                      <option value="Undergraduate">Undergraduate</option>
                      <option value="Master's">Master's</option>
                      <option value="PhD">PhD</option>
                      <option value="High School">High School</option>
                  </select>
              </div>
              <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2" for="gpa_confirm">GPA Range</label>
                  <select id="gpa_confirm" name="gpa_confirm" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                      <option value="90-100">90-100% (A+)</option>
                      <option value="80-89">80-89% (A)</option>
                      <option value="70-79">70-79% (B)</option>
                      <option value="60-69">60-69% (C)</option>
                      <option value="Below 60">Below 60%</option>
                  </select>
              </div>
              <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2" for="grad_year">Graduation Year</label>
                  <input type="number" id="grad_year" name="grad_year" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm">
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="aid_amount">Annual Tuition / Financial Aid Needed ($)</label>
              <div class="relative">
                  <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                  <input type="number" id="aid_amount" name="aid_amount" value="0" class="w-full pl-8 pr-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm">
              </div>
            </div>

            <!-- Experiences -->
            <div>
              <div class="flex items-center justify-between mb-4">
                  <h2 class="text-lg font-bold text-slate-900">Experience</h2>
                  <button type="button" onclick="addExperience()" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-lg hover:bg-indigo-100 transition-colors">
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Add Experience
                  </button>
              </div>
              <div id="experience-container" class="space-y-4"></div>
            </div>

            <!-- Interests -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-3">Academic & Professional Interests</label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {% for tag in ["STEM", "Business", "Arts", "Leadership", "Volunteerism", "Entrepreneurship"] %}
                  <label class="flex items-center gap-2 p-3 border border-slate-100 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
                      <input type="checkbox" name="interests" value="{{ tag }}" class="rounded text-indigo-600 focus:ring-indigo-500">
                      <span class="text-xs text-slate-700 font-medium">{{ tag }}</span>
                  </label>
                  {% endfor %}
              </div>
            </div>

            <div class="pt-4 flex flex-col sm:flex-row gap-4">
              <button type="button" onclick="goToStep(1)" class="flex-1 py-4 px-4 border border-slate-200 text-slate-600 font-bold rounded-2xl hover:bg-slate-50 transition-all">
                Back to Step 1
              </button>
              <button type="submit" class="flex-[2] py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-100 transition-all active:scale-[0.98]">
                Complete Onboarding
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Experience Template -->
    <template id="experience-template">
      <div class="experience-card border border-slate-100 bg-slate-50/50 rounded-2xl p-5 relative group">
          <button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Company</label>
                  <input type="text" name="exp_company[]" placeholder="e.g. Google" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100 transition-all">
              </div>
              <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Role</label>
                  <input type="text" name="exp_role[]" placeholder="e.g. Software Intern" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-100 transition-all">
              </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
              <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Start Date</label>

              <div class="flex items-center my-auto pt-4">
                  <label class="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4" onchange="this.nextElementSibling.value = this.checked ? 'true' : 'false'; const hours = this.closest('.grid').querySelector('input[name=\'exp_hours[]\']'); hours.disabled = !this.checked; if(!this.checked) hours.value=''">

          </div>
      </div>

    <script>
      const cities = ["Toronto, ON", "Montreal, QC", "Vancouver, BC", "Calgary, AB", "Edmonton, AB", "Ottawa, ON", "Winnipeg, MB", "Quebec City, QC", "Hamilton, ON", "Kitchener, ON", "London, ON", "Victoria, BC", "Halifax, NS", "Oshawa, ON", "Windsor, ON", "Saskatoon, SK", "Regina, SK", "St. John's, NL", "Kelowna, BC", "Barrie, ON", "Sherbrooke, QC", "Guelph, ON", "Kanata, ON", "Abbotsford, BC", "Trois-Rivieres, QC", "Kingston, ON", "Milton, ON", "Moncton, NB", "White Rock, BC", "Nanaimo, BC", "Kamloops, BC", "Niagara Falls, ON", "Saint John, NB", "Thunder Bay, ON", "Peterborough, ON", "Lethbridge, AB", "Chatham-Kent, ON", "Belleville, ON", "Sault Ste. Marie, ON", "Sarnia, ON", "Red Deer, AB", "Saint-Jean-sur-Richelieu, QC", "Drummondville, QC", "Prince George, BC", "Chilliwack, BC", "Vernon, BC", "Medicine Hat, AB", "Granby, QC", "Saint-Jerome, QC", "Grande Prairie, AB", "Fredericton, NB", "North Bay, ON", "Saint-Hyacinthe, QC", "Charlottetown, PE", "Brandon, MB", "Rimouski, QC", "Cornwall, ON", "Shawinigan, QC", "Mirabel, QC", "Bridgewater, NS", "Langford, BC", "Woodstock, ON", "Bradford, ON", "Squamish, BC", "Airdrie, AB", "Cochrane, AB", "Okotoks, AB", "Orangeville, ON", "Leduc, AB", "Fort McMurray, AB", "Yellowknife, NT", "Whitehorse, YT", "Iqaluit, NU", "Mississauga, ON", "Brampton, ON", "Vaughan, ON", "Markham, ON", "Oakville, ON", "Burlington, ON", "Richmond Hill, ON", "Richmond, BC", "Burnaby, BC", "Surrey, BC", "Laval, QC", "Longueuil, QC", "Gatineau, QC", "Levis, QC", "Saguenay, QC", "Terrebonne, QC", "Kelowna, BC", "Langley, BC", "Coquitlam, BC", "Delta, BC", "Kamloops, BC", "Chilliwack, BC", "Maple Ridge, BC", "New Westminster, BC", "Port Coquitlam, BC", "West Vancouver, BC", "North Vancouver, BC", "Vernon, BC", "Nanaimo, BC", "Courtenay, BC", "Campbell River, BC", "Penticton, BC", "Port Alberni, BC", "Fort St. John, BC", "Cranbrook, BC", "Terrace, BC", "Quesnel, BC", "Williams Lake, BC", "Prince Rupert, BC", "Dawson Creek, BC", "Trail, BC", "Nelson, BC", "Revelstoke, BC", "Grand Forks, BC", "Rossland, BC", "Fernie, BC", "Kimberley, BC", "Invermere, BC", "Golden, BC", "Castlegar, BC", "Smithers, BC", "Kitimat, BC", "Fort Nelson, BC", "Tumbler Ridge, BC", "Chetwynd, BC", "Vanderhoof, BC", "Burns Lake, BC", "Houston, BC", "Hazelton, BC", "New Hazelton, BC", "Stewart, BC", "Dease Lake, BC", "Atlin, BC", "Masset, BC", "Queen Charlotte, BC", "Sandspit, BC", "Prince Edward, ON", "Brantford, ON", "Pickering, ON", "Niagara Falls, ON", "Greater Sudbury, ON", "Kawartha Lakes, ON", "Sarnia, ON", "Sault Ste. Marie, ON", "North Bay, ON", "Norfolk County, ON", "Timmins, ON", "Woodstock, ON", "St. Thomas, ON", "Stratford, ON", "Orillia, ON", "Owen Sound, ON", "Clarence-Rockland, ON", "Brockville, ON", "Thorold, ON", "Welland, ON", "Port Colborne, ON", "Kenora, ON", "Dryden, ON", "Fort Frances, ON", "Sioux Lookout, ON", "Temiskaming Shores, ON", "Elliot Lake, ON", "Blind River, ON", "Espanola, ON", "Parry Sound, ON", "Huntsville, ON", "Bracebridge, ON", "Gravenhurst, ON", "Midland, ON", "Penetanguishene, ON", "Collingwood, ON", "Wasaga Beach, ON", "Innisfil, ON", "New Tecumseth, ON", "Orangeville, ON", "Shelburne, ON", "Grand Valley, ON", "Fergus, ON", "Elora, ON", "Mount Forest, ON", "Arthur, ON", "Drayton, ON", "Palmerston, ON", "Harriston, ON", "Clifford, ON", "Listowel, ON", "Mitchell, ON", "St. Marys, ON", "Aylmer, ON", "Tillsonburg, ON", "Ingersoll, ON", "Clinton, ON", "Exeter, ON", "Goderich, ON", "Seaforth, ON", "Wingham, ON", "Brussels, ON", "Blyth, ON", "Bayfield, ON", "Grand Bend, ON", "Zurich, ON", "Dashwood, ON", "Hensall, ON", "Kirkton, ON", "Crediton, ON", "Centralia, ON", "Lucan, ON", "Ilderton, ON", "Arva, ON", "Thorndale, ON", "Dorchester, ON", "Belmont, ON", "Lambeth, ON", "Byron, ON", "Hyde Park, ON", "Masonville, ON"];

      function validateForm() {
        const loc = document.getElementById("location");
        const notInCanada = document.getElementById("not_in_canada");
        const error = document.getElementById("location-error");
        
        if (notInCanada.checked) return true;
        
        const val = loc.value.trim().toLowerCase();
        if (val === "") return true;
        
        const isValid = cities.some(c => c.toLowerCase() === val);
        
        if (!isValid) {
          if (error) error.classList.remove("hidden");
          loc.classList.add("border-red-500", "focus:ring-red-100");
          loc.focus();
          return false;
        }
        if (error) error.classList.add("hidden");
        loc.classList.remove("border-red-500", "focus:ring-red-100");
        return true;
      }

      function autocomplete(inp, arr) {
        let currentFocus;
        inp.addEventListener("input", function (e) {
          let a,
            b,
            i,
            val = this.value;
          closeAllLists();
          if (!val) {
            return false;
          }
          currentFocus = -1;
          a = document.getElementById("autocomplete-list");
          if (val.length < 1) return;

          let matches = arr
            .filter((city) => city.toLowerCase().startsWith(val.toLowerCase()))
            .slice(0, 5);

          matches.forEach((match) => {
            b = document.createElement("DIV");
            b.innerHTML =
              "<strong>" + match.substr(0, val.length) + "</strong>";
            b.innerHTML += match.substr(val.length);
            b.innerHTML += "<input type='hidden' value='" + match + "'>";
            b.addEventListener("click", function (e) {
              inp.value = this.getElementsByTagName("input")[0].value;
              closeAllLists();
            });
            a.appendChild(b);
          });
        });

        inp.addEventListener("keydown", function (e) {
          let x = document.getElementById("autocomplete-list");
          if (x) x = x.getElementsByTagName("div");
          if (e.keyCode == 40) {
            currentFocus++;
            addActive(x);
          } else if (e.keyCode == 38) {
            currentFocus--;
            addActive(x);
          } else if (e.keyCode == 13) {
            e.preventDefault();
            if (currentFocus > -1) {
              if (x) x[currentFocus].click();
            }
          }
        });

        function addActive(x) {
          if (!x) return false;
          removeActive(x);
          if (currentFocus >= x.length) currentFocus = 0;
          if (currentFocus < 0) currentFocus = x.length - 1;
          x[currentFocus].classList.add("autocomplete-active");
        }

        function removeActive(x) {
          for (let i = 0; i < x.length; i++) {
            x[i].classList.remove("autocomplete-active");
          }
        }

        function closeAllLists(elmnt) {
          let x = document.getElementsByClassName("autocomplete-items");
          for (let i = 0; i < x.length; i++) {
            if (elmnt != x[i] && elmnt != inp) {
              x[i].innerHTML = "";
            }
          }
        }

        document.addEventListener("click", function (e) {
          closeAllLists(e.target);
        });
      }

      autocomplete(document.getElementById("location"), cities);

      function updateFileName(inputId, displayId) {
        const input = document.getElementById(inputId);
        const display = document.getElementById(displayId);
        console.log("updateFileName called for:", inputId, "Files count:", input.files ? input.files.length : 0);
        if (input.files && input.files.length > 0) {
          console.log("Found file:", input.files[0].name);
          display.textContent = input.files[0].name;
          display.classList.add("text-indigo-600", "font-bold");
        }
      }

      function toggleLocation(cb) {
        const loc = document.getElementById("location");
        if (cb.checked) {
          loc.value = "International / Not in Canada";
          loc.disabled = true;
          loc.classList.add("bg-slate-50", "text-slate-400");
        } else {
          loc.value = "";
          loc.disabled = false;
          loc.classList.remove("bg-slate-50", "text-slate-400");
        }
      }

      // Drag and Drop Handling
      const dropZone = document.getElementById('drop-zone');
      const resumeInput = document.getElementById('resume');
      const resumeName = document.getElementById('resume-name');

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
          dropZone.querySelector('label').classList.add('border-indigo-500', 'bg-indigo-100/50');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
          dropZone.querySelector('label').classList.remove('border-indigo-500', 'bg-indigo-100/50');
        }, false);
      });

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
          resumeInput.files = files;
          updateFileName('resume', 'resume-name');
        }
      }, false);

      // Form Processing State
      document.querySelector('form').addEventListener('submit', function(e) {
        if (!validateForm()) {
            e.preventDefault();
            return;
        }
        
        const btn = document.getElementById('submit-btn');
        const text = document.getElementById('btn-text');
        const icon = document.getElementById('btn-icon');
        const spinner = document.getElementById('loading-spinner');
        
        // Use a slight timeout to ensure form actually submits before UI locks
        setTimeout(() => {
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            text.textContent = 'Processing...';
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
        }, 10);
      });
      function goToStep(step) {
        const step1 = document.getElementById('step-1-content');
        const step2 = document.getElementById('step-2-content');
        const badge = document.getElementById('step-badge');
        const progress = document.getElementById('step-progress');
        const title = document.getElementById('step-title');
        const subtitle = document.getElementById('step-subtitle');

        if (step === 1) {
          step1.classList.remove('hidden');
          step2.classList.add('hidden');
          badge.textContent = 'Step 1 of 2';
          progress.style.width = '50%';
          title.textContent = 'Tell us about yourself';
          subtitle.textContent = "We'll use this to find the best scholarships and autofill your profile.";
          
          // Disable Step 2 fields
          step2.querySelectorAll('input, select, textarea').forEach(el => {
              if (el.hasAttribute('required')) {
                  el.dataset.required = 'true';
                  el.removeAttribute('required');
              }
          });
          // Enable Step 1 fields
          step1.querySelectorAll('[data-required="true"]').forEach(el => {
              el.setAttribute('required', 'required');
          });
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          step1.classList.add('hidden');
          step2.classList.remove('hidden');
          badge.textContent = 'Step 2 of 2';
          progress.style.width = '100%';
          title.textContent = 'Confirm Your Profile';
          subtitle.textContent = "Review your information and add your experience to finish your profile.";
          
          // Disable Step 1 fields
          step1.querySelectorAll('input, select, textarea').forEach(el => {
              if (el.hasAttribute('required')) {
                  el.dataset.required = 'true';
                  el.removeAttribute('required');
              }
          });
          // Enable Step 2 fields
          step2.querySelectorAll('[data-required="true"]').forEach(el => {
              el.setAttribute('required', 'required');
          });

          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      async function autofillAndContinue() {
        // Enforce Step 1 HTML5 validation before proceeding
        const step1Content = document.getElementById('step-1-content');
        const step1Inputs = step1Content.querySelectorAll('input, select, textarea');
        for (let el of step1Inputs) {
          if ((el.hasAttribute('required') || el.dataset.required === 'true') && !el.checkValidity()) {
            el.reportValidity();
            return;
          }
        }

        if (!validateForm()) return;

        const btn = document.getElementById('continue-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const spinner = document.getElementById('loading-spinner');
        const form = document.getElementById('onboarding-form');

        // Show loading state
        btn.disabled = true;
        btnText.textContent = 'Analyzing Resume...';
        btnIcon.classList.add('hidden');
        spinner.classList.remove('hidden');

        try {
          const formData = new FormData(form);
          const response = await fetch('/onboarding', {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            const data = await response.json();
            if (data.status === 'ok') {
              populateStep2(data.profile);
              goToStep(2);
            }
          } else {
            console.error('Autofill failed');
            // Fallback: move to step 2 anyway so they can fill manually
            goToStep(2);
          }
        } catch (err) {
          console.error('Network error during autofill:', err);
          goToStep(2);
        } finally {
          // Reset button state
          btn.disabled = false;
          btnText.textContent = 'Autofill from Resume & Continue';
          btnIcon.classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      }

      function populateStep2(profile) {
        if (!profile) return;
        
        const fields = ['institution', 'major', 'degree', 'grad_year', 'aid_amount'];
        fields.forEach(f => {
          const el = document.getElementById(f);
          if (el && profile[f]) el.value = profile[f];
        });

        // Special handling for GPA dropdown in Step 2
        if (profile.gpa) {
          document.getElementById('gpa_confirm').value = profile.gpa;
        }

        // Populate Experiences
        const container = document.getElementById('experience-container');
        container.innerHTML = '';
        if (profile.experiences && Array.isArray(profile.experiences)) {
          profile.experiences.forEach(exp => addExperience(exp));
        }

        // Interests checkboxes
        if (profile.interests && Array.isArray(profile.interests)) {
          const checkboxes = document.querySelectorAll('input[name="interests"]');
          checkboxes.forEach(cb => {
            if (profile.interests.includes(cb.value)) cb.checked = true;
          });
        }
      }

      function addExperience(data = null) {
        const container = document.getElementById('experience-container');
        const template = document.getElementById('experience-template');
        const clone = template.content.cloneNode(true);
        
        if (data) {
          clone.querySelector('input[name="exp_company[]"]').value = data.company || '';
          clone.querySelector('input[name="exp_role[]"]').value = data.role || '';
          clone.querySelector('input[name="exp_start[]"]').value = data.start_date || '';
          clone.querySelector('input[name="exp_end[]"]').value = data.end_date || '';
          clone.querySelector('textarea[name="exp_desc[]"]').value = data.description || '';
          
          if (data.current) {
            const cb = clone.querySelector('input[type="checkbox"]');
            cb.checked = true;
            clone.querySelector('input[name="exp_current[]"]').value = 'true';
          }
        }
        
        container.appendChild(clone);
      }
    </script>
