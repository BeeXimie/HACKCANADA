<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to ScholarSync - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }
      .autocomplete-items {
        position: absolute;
        border: 1px solid #e2e8f0;
        border-bottom: none;
        border-top: none;
        z-index: 99;
        top: 100%;
        left: 0;
        right: 0;
        border-radius: 0 0 0.75rem 0.75rem;
        max-height: 200px;
        overflow-y: auto;
      }
      .autocomplete-items div {
        padding: 0.75rem 1rem;
        cursor: pointer;
        background-color: #fff;
        border-bottom: 1px solid #f1f5f9;
      }
      .autocomplete-items div:hover {
        background-color: #f8fafc;
      }
      .autocomplete-active {
        background-color: #e2e8f0 !important;
      }

  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex flex-col items-center justify-center p-4"
  >
    <!-- Logo -->
    <div class="mb-4 flex items-center justify-center gap-2 text-indigo-600">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-8 w-8"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
        <path d="M6 12v5c3 3 9 3 12 0v-5" />
      </svg>
      <span class="text-2xl font-bold tracking-tight text-slate-900"

    </div>

    <!-- Onboarding Form Container -->
    <div
      class="w-full max-w-2xl glass-panel border border-white rounded-3xl shadow-xl overflow-hidden"
    >
      <div
        class="h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"
      ></div>

      <div class="p-8 sm:p-10">
        <div id="onboarding-header" class="mb-8">
          <div class="flex items-center gap-2 mb-2">
            <span id="step-badge" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider">Step 1 of 2</span>
            <div class="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
              <div id="step-progress" class="w-1/2 h-full bg-indigo-500 transition-all duration-500"></div>
            </div>
          </div>
          <h1 id="step-title" class="text-2xl font-bold text-slate-900 mb-1">Tell us about yourself</h1>
          <p id="step-subtitle" class="text-sm text-slate-500">We'll use this to find the best scholarships and autofill your profile.</p>
        </div>

        <form id="onboarding-form" action="/onboarding" method="POST" enctype="multipart/form-data" class="space-y-6">
          <!-- Step 1: Basic Info & Resume -->
          <div id="step-1-content" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Location -->
            <div class="relative">
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="location"
                >Location</label

              <div class="relative autocomplete">
                <input
                  type="text"
                  id="location"
                  name="location" placeholder="Search Canadian cities..."
                  class="w-full pl-4 pr-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm"
                />
                <div
                  id="autocomplete-list"
                  class="autocomplete-items shadow-lg"
                ></div>
              </div>
              <p id="location-error" class="hidden text-xs text-red-500 mt-1 font-medium">Please select a valid city from the list.</p>
              <div class="flex items-center mt-2 gap-2">
                <input
                  type="checkbox"
                  id="not_in_canada"
                  name="not_in_canada"
                  class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4"
                  onchange="toggleLocation(this)"
                />
                <label
                  for="not_in_canada"
                  class="text-xs text-slate-500 cursor-pointer"
                  >I am currently outside of Canada</label
                >
              </div>
            </div>
            <!-- Removed duplicate GPA dropdown -->
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Gender -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="gender"
                >Gender</label
              >
              <select
                id="gender"
                name="gender" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>

            <!-- Ethnicity -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="ethnicity"
                >Ethnicity</label
              >
              <select
                id="ethnicity"
                name="ethnicity" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select</option>
                <option value="Indigenous">Indigenous</option>
                <option value="Black">Black</option>
                <option value="Asian">Asian</option>
                <option value="White">White</option>
                <option value="Hispanic">Hispanic</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Year of Study -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="year_of_study"
                >Year of Study</label
              >
              <select
                id="year_of_study"
                name="year_of_study" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"
              >
                <option value="" disabled selected>Select year</option>
                <option value="Incoming First Year">Incoming First Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
                <option value="Graduate">Graduate</option>
              </select>
            </div>
            <!-- Citizenship -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-2"
                for="citizenship"
                >Citizenship</label
              >
              <select
                id="citizenship"
                name="citizenship" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white"

                <option value="" disabled selected>Select</option>
                <option value="Domestic">Domestic (Citizen/PR)</option>
                <option value="International">International (Visa)</option>
              </select>
            </div>
          </div>

          <!-- Eligibility Fields (New) -->

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="income_bracket">Household Income</label>

                <option value="Under $30,000">Under $30,000</option>
                <option value="$30,000 – $60,000">$30,000 – $60,000</option>
                <option value="$60,000 – $100,000">$60,000 – $100,000</option>
                <option value="$100,000 – $150,000">$100,000 – $150,000</option>
                <option value="Over $150,000">Over $150,000</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2" for="first_gen">First-Gen Student?</label>
              <select id="first_gen" name="first_gen" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all text-sm bg-white">
                <option value="" disabled selected>Select option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>

          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>

                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>

            </div>
            <div>

                <option value="90-100%">90-100%</option>
                <option value="80-89%">80-89%</option>
                <option value="70-79%">70-79%</option>
                <option value="60-69%">60-69%</option>
                <option value="Below 60%">Below 60%</option>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>

                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Prefer not to say">Prefer not to say</option>

            </div>

            <!-- Resume Upload -->

              <label class="block text-sm font-semibold text-slate-700 mb-3"

                    <svg

                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"

                      <polyline points="14 2 14 8 20 8" />

                      <line x1="9" y1="15" x2="15" y2="15" />

                  </div>

                    class="text-sm font-semibold text-slate-600"

                  type="file"
                  id="resume"
                  name="resume"
                  accept=".pdf" class="hidden"
                  onchange="updateFileName('resume', 'resume-name')"
                />
              </div>
            </div>

            <!-- Transcript Upload -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-3"

                    <svg

                      <path

                      />
                      <polyline points="14 2 14 8 20 8" />
                      <path d="M12 18V12" />
                      <path d="M9 15l3-3 3 3" />

                  </div>
                  <span

                    class="text-sm font-semibold text-slate-600"
                    >Click to upload transcript</span
                  >
                  <span class="text-xs text-slate-400 mt-1"
                    >Provide for academic validation</span
                  >
                </label>
                <input
                  type="file"
                  id="transcript"
                  name="transcript"
                  accept=".pdf"
                  class="hidden"
                  onchange="updateFileName('transcript', 'transcript-name')"
                />
              </div>
            </div>
          </div>

          <script>
            function updateFileName(inputId, nameId) {
              const file = document.getElementById(inputId).files[0];
              const nameSpan = document.getElementById(nameId);
              if (file) {
                nameSpan.innerHTML = `<span class="text-indigo-600 font-bold">Selected: ${file.name}</span>`;
                console.log(`File selected for ${inputId}:`, file.name);
              }
            }
          </script>

            <button
              type="submit"
              id="continue-btn"
              class="w-full flex items-center justify-center gap-2 py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-100 transition-all active:scale-[0.98]"
            >
              <span id="btn-text">Autofill from Resume & Continue</span>
              <svg id="btn-icon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              <svg id="loading-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>

      </div>
    </div>

    <!-- No Step 2 needed here - handled by onboarding_confirm.html -->

        </form>
      </div>
    </div>

    <script>
      const cities = ["Toronto, ON", "Montreal, QC", "Vancouver, BC", "Calgary, AB", "Edmonton, AB", "Ottawa, ON", "Winnipeg, MB", "Quebec City, QC", "Hamilton, ON", "Kitchener, ON", "London, ON", "Victoria, BC", "Halifax, NS", "Oshawa, ON", "Windsor, ON", "Saskatoon, SK", "Regina, SK", "St. John's, NL", "Kelowna, BC", "Barrie, ON", "Sherbrooke, QC", "Guelph, ON", "Kanata, ON", "Abbotsford, BC", "Trois-Rivieres, QC", "Kingston, ON", "Milton, ON", "Moncton, NB", "White Rock, BC", "Nanaimo, BC", "Kamloops, BC", "Niagara Falls, ON", "Saint John, NB", "Thunder Bay, ON", "Peterborough, ON", "Lethbridge, AB", "Chatham-Kent, ON", "Belleville, ON", "Sault Ste. Marie, ON", "Sarnia, ON", "Red Deer, AB", "Saint-Jean-sur-Richelieu, QC", "Drummondville, QC", "Prince George, BC", "Chilliwack, BC", "Vernon, BC", "Medicine Hat, AB", "Granby, QC", "Saint-Jerome, QC", "Grande Prairie, AB", "Fredericton, NB", "North Bay, ON", "Saint-Hyacinthe, QC", "Charlottetown, PE", "Brandon, MB", "Rimouski, QC", "Cornwall, ON", "Shawinigan, QC", "Mirabel, QC", "Bridgewater, NS", "Langford, BC", "Woodstock, ON", "Bradford, ON", "Squamish, BC", "Airdrie, AB", "Cochrane, AB", "Okotoks, AB", "Orangeville, ON", "Leduc, AB", "Fort McMurray, AB", "Yellowknife, NT", "Whitehorse, YT", "Iqaluit, NU", "Mississauga, ON", "Brampton, ON", "Vaughan, ON", "Markham, ON", "Oakville, ON", "Burlington, ON", "Richmond Hill, ON", "Richmond, BC", "Burnaby, BC", "Surrey, BC", "Laval, QC", "Longueuil, QC", "Gatineau, QC", "Levis, QC", "Saguenay, QC", "Terrebonne, QC", "Kelowna, BC", "Langley, BC", "Coquitlam, BC", "Delta, BC", "Kamloops, BC", "Chilliwack, BC", "Maple Ridge, BC", "New Westminster, BC", "Port Coquitlam, BC", "West Vancouver, BC", "North Vancouver, BC", "Vernon, BC", "Nanaimo, BC", "Courtenay, BC", "Campbell River, BC", "Penticton, BC", "Port Alberni, BC", "Fort St. John, BC", "Cranbrook, BC", "Terrace, BC", "Quesnel, BC", "Williams Lake, BC", "Prince Rupert, BC", "Dawson Creek, BC", "Trail, BC", "Nelson, BC", "Revelstoke, BC", "Grand Forks, BC", "Rossland, BC", "Fernie, BC", "Kimberley, BC", "Invermere, BC", "Golden, BC", "Castlegar, BC", "Smithers, BC", "Kitimat, BC", "Fort Nelson, BC", "Tumbler Ridge, BC", "Chetwynd, BC", "Vanderhoof, BC", "Burns Lake, BC", "Houston, BC", "Hazelton, BC", "New Hazelton, BC", "Stewart, BC", "Dease Lake, BC", "Atlin, BC", "Masset, BC", "Queen Charlotte, BC", "Sandspit, BC", "Prince Edward, ON", "Brantford, ON", "Pickering, ON", "Niagara Falls, ON", "Greater Sudbury, ON", "Kawartha Lakes, ON", "Sarnia, ON", "Sault Ste. Marie, ON", "North Bay, ON", "Norfolk County, ON", "Timmins, ON", "Woodstock, ON", "St. Thomas, ON", "Stratford, ON", "Orillia, ON", "Owen Sound, ON", "Clarence-Rockland, ON", "Brockville, ON", "Thorold, ON", "Welland, ON", "Port Colborne, ON", "Kenora, ON", "Dryden, ON", "Fort Frances, ON", "Sioux Lookout, ON", "Temiskaming Shores, ON", "Elliot Lake, ON", "Blind River, ON", "Espanola, ON", "Parry Sound, ON", "Huntsville, ON", "Bracebridge, ON", "Gravenhurst, ON", "Midland, ON", "Penetanguishene, ON", "Collingwood, ON", "Wasaga Beach, ON", "Innisfil, ON", "New Tecumseth, ON", "Orangeville, ON", "Shelburne, ON", "Grand Valley, ON", "Fergus, ON", "Elora, ON", "Mount Forest, ON", "Arthur, ON", "Drayton, ON", "Palmerston, ON", "Harriston, ON", "Clifford, ON", "Listowel, ON", "Mitchell, ON", "St. Marys, ON", "Aylmer, ON", "Tillsonburg, ON", "Ingersoll, ON", "Clinton, ON", "Exeter, ON", "Goderich, ON", "Seaforth, ON", "Wingham, ON", "Brussels, ON", "Blyth, ON", "Bayfield, ON", "Grand Bend, ON", "Zurich, ON", "Dashwood, ON", "Hensall, ON", "Kirkton, ON", "Crediton, ON", "Centralia, ON", "Lucan, ON", "Ilderton, ON", "Arva, ON", "Thorndale, ON", "Dorchester, ON", "Belmont, ON", "Lambeth, ON", "Byron, ON", "Hyde Park, ON", "Masonville, ON"];

      function validateForm() {
        const loc = document.getElementById("location");
        const notInCanada = document.getElementById("not_in_canada");
        const error = document.getElementById("location-error");
        
        if (notInCanada.checked) return true;
        
        const val = loc.value.trim().toLowerCase();
        if (val === "") return true;
        
        const isValid = cities.some(c => c.toLowerCase() === val);
        
        if (!isValid) {
          if (error) error.classList.remove("hidden");
          loc.classList.add("border-red-500", "focus:ring-red-100");
          loc.focus();
          return false;
        }
        if (error) error.classList.add("hidden");
        loc.classList.remove("border-red-500", "focus:ring-red-100");
        return true;
      }

      function autocomplete(inp, arr) {
        let currentFocus;
        inp.addEventListener("input", function (e) {
          let a,
            b,
            i,
            val = this.value;
          closeAllLists();
          if (!val) {
            return false;
          }
          currentFocus = -1;
          a = document.getElementById("autocomplete-list");
          if (val.length < 1) return;

          let matches = arr
            .filter((city) => city.toLowerCase().startsWith(val.toLowerCase()))
            .slice(0, 5);

          matches.forEach((match) => {
            b = document.createElement("DIV");
            b.innerHTML =
              "<strong>" + match.substr(0, val.length) + "</strong>";
            b.innerHTML += match.substr(val.length);
            b.innerHTML += "<input type='hidden' value='" + match + "'>";
            b.addEventListener("click", function (e) {
              inp.value = this.getElementsByTagName("input")[0].value;
              closeAllLists();
            });
            a.appendChild(b);
          });
        });

        inp.addEventListener("keydown", function (e) {
          let x = document.getElementById("autocomplete-list");
          if (x) x = x.getElementsByTagName("div");
          if (e.keyCode == 40) {
            currentFocus++;
            addActive(x);
          } else if (e.keyCode == 38) {
            currentFocus--;
            addActive(x);
          } else if (e.keyCode == 13) {
            e.preventDefault();
            if (currentFocus > -1) {
              if (x) x[currentFocus].click();
            }
          }
        });

        function addActive(x) {
          if (!x) return false;
          removeActive(x);
          if (currentFocus >= x.length) currentFocus = 0;
          if (currentFocus < 0) currentFocus = x.length - 1;
          x[currentFocus].classList.add("autocomplete-active");
        }

        function removeActive(x) {
          for (let i = 0; i < x.length; i++) {
            x[i].classList.remove("autocomplete-active");
          }
        }

        function closeAllLists(elmnt) {
          let x = document.getElementsByClassName("autocomplete-items");
          for (let i = 0; i < x.length; i++) {
            if (elmnt != x[i] && elmnt != inp) {
              x[i].innerHTML = "";
            }
          }
        }

        document.addEventListener("click", function (e) {
          closeAllLists(e.target);
        });
      }

      autocomplete(document.getElementById("location"), cities);

      function updateFileName(inputId, displayId) {
        const input = document.getElementById(inputId);
        const display = document.getElementById(displayId);
        console.log("updateFileName called for:", inputId, "Files count:", input.files ? input.files.length : 0);
        if (input.files && input.files.length > 0) {
          console.log("Found file:", input.files[0].name);
          display.textContent = input.files[0].name;
          display.classList.add("text-indigo-600", "font-bold");
        }
      }

      function toggleLocation(cb) {
        const loc = document.getElementById("location");
        if (cb.checked) {
          loc.value = "International / Not in Canada";
          loc.disabled = true;
          loc.classList.add("bg-slate-50", "text-slate-400");
        } else {
          loc.value = "";
          loc.disabled = false;
          loc.classList.remove("bg-slate-50", "text-slate-400");
        }
      }

      // Drag and Drop Handling
      const dropZone = document.getElementById('resume-drop-zone');
      const resumeInput = document.getElementById('resume');
      const resumeName = document.getElementById('resume-name');

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
          dropZone.querySelector('label').classList.add('border-indigo-500', 'bg-indigo-100/50');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
          dropZone.querySelector('label').classList.remove('border-indigo-500', 'bg-indigo-100/50');
        }, false);
      });

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
          resumeInput.files = files;
          updateFileName('resume', 'resume-name');
        }
      }, false);

      // Form Processing State
      document.querySelector('form').addEventListener('submit', function(e) {
        if (!validateForm()) {
            e.preventDefault();
            return;
        }
        
        const btn = document.getElementById('continue-btn');
        const text = document.getElementById('btn-text');
        const icon = document.getElementById('btn-icon');
        const spinner = document.getElementById('loading-spinner');
        
        // Use a slight timeout to ensure form actually submits before UI locks
        setTimeout(() => {
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            text.textContent = 'Processing...';
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
        }, 10);
      });
    </script>
  </body>
</html>
