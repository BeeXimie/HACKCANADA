<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses & Tuition</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Expenses & Tuition</h1>
        <p>Enter your current tuition and living expenses below to get insights on your budget.</p>
        
        <form method="POST" class="expenses-form">
            <div class="form-group">
                <label for="tuition">Yearly Tuition ($)</label>
                <input type="number" id="tuition" name="tuition" placeholder="e.g., 15000" required>
            </div>
            
            <div class="form-group">
                <label for="housing">Monthly Housing ($)</label>
                <input type="number" id="housing" name="housing" placeholder="e.g., 800" required>
            </div>
            
            <div class="form-group">
                <label for="food">Monthly Food ($)</label>
                <input type="number" id="food" name="food" placeholder="e.g., 300" required>
            </div>
            
            <button type="submit" class="button">Save Expenses</button>
        </form>
        
        <div class="actions" style="margin-top: 2rem;">
            <a href="/profile" class="button" style="background-color: var(--secondary-color);">Back to Profile</a>
            <a href="/" class="button">Home</a>
        </div>
    </div>
</div>
</body>
</html>
